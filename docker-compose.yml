services:
  ollama:
    image: ollama/ollama:latest@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: ollama-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-data:/root/.ollama
    gpus: all

volumes:
  ollama-data:
